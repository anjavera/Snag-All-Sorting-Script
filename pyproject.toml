[project]
name = "file-organizer"
version = "2.0.0"
description = "Cross-platform file organizer: chronological, metadata-aware, and pattern-grouping (e.g. 'English 3' -> Essays, Glossaries, Notes)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
    "Pillow>=10.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]

[project.scripts]
organize = "file_organizer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/file_organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
